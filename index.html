<!DOCTYPE html>
<html>
<head>
    <title>Student Score Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: rgb(5, 165, 218);
            padding: 40px;
        }

        .container {
            background-color: rgb(230, 232, 99);
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
        }

        button {
            padding: 12px 25px;
            margin: 15px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Student Score Calculator</h1>

    <p>Student's information</p>

    <input type="text" id="studentName" value="Lennox" placeholder="Lennox">
    <br>

    <input type="number" id="score1" value="95" placeholder="Test Score 1">
    <br>

    <input type="number" id="score2" value="89" placeholder=" Score 2">
    <br>

    <input type="number" id="score3" value="93" placeholder=" Score 3">
    <br>

    <button onclick="createStudent()">Calculate Average</button>

    <div id="result"></div>
</div>

<script src="app.js"></script>

</body>
</html>
